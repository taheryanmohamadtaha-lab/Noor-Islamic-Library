name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build a signed Release APK (needs the 4 signing secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch authentic content and run content QC
        run: python scripts/build_content.py

      - name: Fetch fonts (OFL)
        run: bash scripts/fetch_fonts.sh

      - name: Upload content QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-qc-report
          path: qc-report/
          if-no-files-found: ignore

      - name: Show QC report in job summary
        if: always()
        run: |
          if [ -f qc-report/QC-REPORT.md ]; then cat qc-report/QC-REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Noor-Islamic-Library.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Islamic-Library-debug
          path: Noor-Islamic-Library.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build signed Release APK
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Signing secrets are not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Noor-Islamic-Library-release.apk

      - name: Upload Release APK
        if: ${{ github.event.inputs.release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Islamic-Library-release
          path: Noor-Islamic-Library-release.apk
